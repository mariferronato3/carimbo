<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1F3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carimbo">
<title>Carimbo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6FA; --card:#FFFFFF; --sunk:#E9EDF4;
  --ink:#0E1F3A; --ink-2:#4F5D78; --ink-3:#8793AA; --line:#DCE2EC;
  --stamp:#6A3FC4; --stamp-soft:#EEE8FB; --on-stamp:#FFFFFF;
  --ok:#1D7A55; --ok-soft:#E2F2EA; --warn:#94560B; --warn-soft:#FBEFDC; --bad:#B42335; --bad-soft:#FBE5E8;
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 0 rgba(14,31,58,.04),0 6px 20px -12px rgba(14,31,58,.25);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#0B1322; --card:#14203A; --sunk:#1B2944;
  --ink:#E9EEF8; --ink-2:#A7B3CA; --ink-3:#71809D; --line:#26365A;
  --stamp:#A88CFF; --stamp-soft:#2A2350; --on-stamp:#14092E;
  --ok:#5CCB9A; --ok-soft:#14352A; --warn:#F0B35E; --warn-soft:#3A2A12; --bad:#FF7F8E; --bad-soft:#3E1A22;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 24px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --paper:#0B1322; --card:#14203A; --sunk:#1B2944;
  --ink:#E9EEF8; --ink-2:#A7B3CA; --ink-3:#71809D; --line:#26365A;
  --stamp:#A88CFF; --stamp-soft:#2A2350; --on-stamp:#14092E;
  --ok:#5CCB9A; --ok-soft:#14352A; --warn:#F0B35E; --warn-soft:#3A2A12; --bad:#FF7F8E; --bad-soft:#3E1A22;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--sans);min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Topo */
.top{position:relative;padding:calc(env(safe-area-inset-top) + 18px) 0 0;overflow:hidden}
.top-row{display:flex;align-items:center;gap:12px}
.mark{display:flex;align-items:center;gap:10px;font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0}
.mark svg{width:34px;height:34px;flex:none}
.top-row .icon-btn{margin-left:auto}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.next{margin:14px 0 0;font-size:15px;color:var(--ink-2)}
.next b{color:var(--ink);font-weight:600}
.guil{display:block;height:34px;margin-top:10px;color:var(--stamp);opacity:.35}
.guil svg{width:100%;height:100%}

/* Filtros */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:15px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.add{border-style:dashed;background:transparent;color:var(--ink-2)}
.chip small{font-size:13px;opacity:.65;margin-left:4px}

h2.sec{font-size:17px;font-weight:700;margin:26px 0 10px;display:flex;align-items:baseline;gap:8px}
h2.sec .link{margin-left:auto;font-size:15px;font-weight:600;color:var(--stamp);background:none;border:0;padding:4px 0}

/* Alerta */
.alert{margin-top:18px;border-radius:16px;background:var(--warn-soft);color:var(--warn);padding:14px 16px;font-size:15px}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert strong{display:block;font-weight:700;margin-bottom:2px}
.alert button{background:none;border:0;padding:0;color:inherit;text-decoration:underline;font-weight:600}

/* À mão */
.hand{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;aspect-ratio:1.42;border:0;border-radius:18px;overflow:hidden;padding:0;text-align:left;background:var(--tc,var(--ink));color:#fff;box-shadow:var(--shadow)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,15,30,.55),transparent 45%,rgba(8,15,30,.5))}
.tile span{z-index:1}
.tile span{position:absolute;left:12px;right:12px}
.tile .t{top:12px;font-weight:700;font-size:16px;line-height:1.2}
.tile .n{bottom:12px;font-family:var(--mono);font-size:14px;letter-spacing:.06em;opacity:.95}

/* Lista */
.list{display:grid;gap:10px}
.doc{display:grid;grid-template-columns:56px 1fr;gap:4px 14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 0;box-shadow:var(--shadow);overflow:hidden;position:relative}
.doc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.thumb{width:56px;height:56px;border-radius:14px;background:color-mix(in srgb,var(--tc) 12%,var(--card));display:grid;place-items:center;color:var(--tc)}
.thumb .ti{width:28px;height:28px}
.tile .big-ic{position:absolute;right:-6px;bottom:-10px;left:auto;width:96px;height:96px;opacity:.22;color:#fff}
.tile .big-ic .ti{width:100%;height:100%}
h2.sec .gi{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--tc) 12%,var(--card));color:var(--tc);align-self:center}
h2.sec .gi .ti{width:17px;height:17px}
.kind .ki{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;flex:none;background:color-mix(in srgb,var(--tc) 12%,var(--card));color:var(--tc)}
.kind .ki .ti{width:22px;height:22px}
.types span .ti{width:17px;height:17px;color:var(--tc)}
.types input:checked+span .ti{color:inherit}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) :is(.thumb,h2.sec .gi,.kind .ki,.types span .ti){color:color-mix(in srgb,var(--tc) 45%,#fff)}}
:root[data-theme=dark] :is(.thumb,h2.sec .gi,.kind .ki,.types span .ti){color:color-mix(in srgb,var(--tc) 45%,#fff)}
.thumb img{width:100%;height:100%;object-fit:cover}
.doc-main{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.doc-title{font-weight:600;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-num{font-family:var(--mono);font-size:14px;color:var(--ink-2);letter-spacing:.04em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.tag{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-2)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.doc.plain{padding-bottom:14px}
.group h2.sec{margin-top:24px}
h2.sec small{font-size:14px;font-weight:600;color:var(--ink-3)}
.mrz{grid-column:1/-1;margin:12px -14px 0;padding:7px 14px 8px;border-top:1px dashed var(--line);font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--ink-3);white-space:nowrap;overflow:hidden}

/* Viagem */
.trip{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.trip h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.trip .when{color:var(--ink-2);margin:2px 0 0;font-size:15px}
.progress{height:8px;border-radius:99px;background:var(--sunk);margin:16px 0 6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.pcount{font-size:14px;color:var(--ink-2)}
.checks{list-style:none;padding:0;margin:10px 0 0}
.checks li{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.checks label{display:flex;align-items:center;gap:12px;flex:1;min-height:32px;cursor:pointer}
.checks input[type=checkbox]{width:24px;height:24px;accent-color:var(--ok);flex:none}
.checks .done span{color:var(--ink-3);text-decoration:line-through}
.checks .x{border:0;background:none;color:var(--ink-3);width:36px;height:36px;border-radius:50%;font-size:20px}
.addcheck{display:flex;gap:8px;margin-top:10px}
.addcheck input{flex:1}
.row-btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

/* Botões */
.btn{height:52px;padding:0 20px;border-radius:999px;border:0;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.stamp{background:var(--stamp);color:var(--on-stamp)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{height:42px;font-size:15px;padding:0 16px}
.btn.grow{flex:1}

.fab{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(to top,var(--paper) 60%,transparent);pointer-events:none}
.fab .wrap{display:flex;gap:10px;padding:0;pointer-events:auto}
.fab .btn{flex:1;box-shadow:0 10px 24px -10px rgba(14,31,58,.5)}
main{padding-bottom:120px}

.empty{text-align:center;padding:40px 12px 20px;color:var(--ink-2)}
.empty svg{width:120px;height:120px;color:var(--stamp);opacity:.7}
.empty h3{color:var(--ink);font-size:20px;margin:10px 0 6px}
.empty p{margin:0 auto;max-width:34ch}

/* Diálogos */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:100%;max-width:560px;max-height:100dvh;margin:auto auto 0;border-radius:24px 24px 0 0}
dialog::backdrop{background:rgba(8,15,30,.55)}
dialog[open]{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:600px){dialog{margin:auto;border-radius:24px;max-height:92dvh}}
.sheet{display:flex;flex-direction:column;max-height:inherit}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.sheet-h h2{margin:0;font-size:20px;font-weight:800;flex:1}
.sheet-b{overflow:auto;padding:4px 16px 16px}
.sheet-f{display:flex;gap:10px;padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--line)}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field small{display:block;color:var(--ink-3);font-size:13px;margin-top:5px}
.inp{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px}
textarea.inp{height:auto;min-height:80px;padding:12px 14px;resize:vertical}
.inp.mono{font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types{display:flex;flex-wrap:wrap;gap:8px}
.types label{position:relative}
.types input{position:absolute;opacity:0}
.types span{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:15px}
.types input:checked+span{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.types input:focus-visible+span{outline:3px solid var(--stamp);outline-offset:2px}
.switch{display:flex;align-items:center;gap:12px;margin-top:16px;font-weight:500}
.switch input{width:24px;height:24px;accent-color:var(--stamp)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:8px}
.fthumb{position:relative;aspect-ratio:1;border-radius:12px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink-2)}
.fthumb img{width:100%;height:100%;object-fit:cover}
.fthumb button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(8,15,30,.7);color:#fff;font-size:16px;line-height:1}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick label{cursor:pointer}
.pick input{position:absolute;opacity:0;width:1px;height:1px}

.lead{color:var(--ink-2);margin:0 0 14px}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kind{min-height:64px;border-radius:16px;border:1px solid var(--line);background:var(--card);text-align:left;padding:12px 14px;font-weight:600;font-size:16px;line-height:1.2;display:flex;align-items:center;gap:10px}
.kind:active{background:var(--sunk)}
.link-plain{display:block;background:none;border:0;color:var(--stamp);font-weight:600;padding:14px 0 4px;margin:4px auto 0}
.reading{text-align:center;padding:28px 8px 20px}
.reading svg{width:112px;height:112px;color:var(--stamp)}
.reading .ring{transform-origin:60px 60px;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.reading h3{font-size:21px;margin:14px 0 4px}
.reading p{margin:0;color:var(--ink-2)}
.reading .fine{font-size:14px;color:var(--ink-3);margin-top:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fgrid .wide{grid-column:1/-1}
.fgrid .field{min-width:0}
.hint{display:block;color:var(--warn);font-size:13px;margin-top:6px}
.v-body{display:flex;flex-direction:column}
.v-body>*{flex-shrink:0}
.info.top{order:0;padding-bottom:4px}
.v-body>.info:not(.top){order:1;padding-top:0}
.v-body>.slides{order:2;margin-bottom:16px}
.v-body>.dots{order:3;margin-bottom:8px}
.v-body>.info.end{order:4;padding-top:0}
.info.end .row-btns{margin-top:8px}
.info:not(.top) .facts{margin-top:4px}
.info.top .big-num{margin-top:4px}
.auto-note{margin:4px 0 0;background:var(--stamp-soft);border-radius:14px;padding:12px 14px;font-size:15px}
.auto-note.warn{background:var(--warn-soft);color:var(--warn)}
.inp.auto{border-color:var(--stamp);box-shadow:inset 3px 0 0 var(--stamp)}
#pickstatus{color:var(--stamp);font-weight:600}

/* Visualizador */
#viewer{max-width:none;height:100dvh;max-height:100dvh;margin:0;border-radius:0;background:var(--paper)}
#viewer[open]{animation:fade .2s}
@keyframes fade{from{opacity:0}}
.v{display:flex;flex-direction:column;height:100%}
.v-h{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px 8px}
.v-h h2{flex:1;margin:0;font-size:18px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-body{flex:1;overflow:auto;max-width:760px;width:100%;margin:0 auto}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:4px 16px;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;border-radius:18px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;min-height:240px;max-height:58dvh}
.slide img{width:100%;height:100%;max-height:58dvh;object-fit:contain;display:block;background:#fff}
.slide.pdfpage{display:block;background:#fff;min-height:0;max-height:none}
.slide.pdfpage img{width:100%;height:auto;max-height:none;object-fit:contain}
.slide.nofile{color:var(--ink-3);padding:30px;text-align:center}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.info{padding:8px 16px 20px}
.big-num{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.big-num div{flex:1;min-width:0}
.big-num small{display:block;color:var(--ink-2);font-size:14px;font-weight:600}
.big-num strong{display:block;font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:.08em;word-break:break-all}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.fact small{display:block;color:var(--ink-2);font-size:14px;font-weight:600}
.fact b{display:block;font-size:17px;font-weight:600;margin-top:2px}
.fact.wide{grid-column:1/-1}
.fact.ok b{color:var(--ok)} .fact.warn b{color:var(--warn)} .fact.bad b{color:var(--bad)}
.notes{white-space:pre-wrap;font-weight:400!important;font-size:16px!important}
.v-f{display:flex;align-items:center;gap:10px;padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line);max-width:760px;width:100%;margin:0 auto}
.v-f .count{flex:1;text-align:center;font-weight:600;color:var(--ink-2)}
.present .big-num strong{font-size:34px}
.present .fact b{font-size:20px}
.present .v-h h2{font-size:22px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;white-space:nowrap}
.doc-wrap{position:relative}
.boxes{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin-top:12px}
.tag.day{background:color-mix(in srgb,var(--tc) 14%,var(--card));color:var(--ink)}
.box{background:var(--sunk);border-radius:10px;padding:6px 10px;min-width:0}
.box.wide{grid-column:1/-1}
.box small{display:block;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc.plain .boxes{margin-bottom:0}
.fact a{color:var(--stamp)}
.doc-wrap .doc-main{padding-right:34px}
.doc-del{position:absolute;top:10px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink-3);display:grid;place-items:center}
.doc-del svg{width:19px;height:19px}
.doc-del:hover,.doc-del:focus-visible{background:var(--bad-soft);color:var(--bad)}
.toast.undo{pointer-events:auto;padding:6px 6px 6px 18px;display:flex;align-items:center;gap:6px}
.toast button{border:0;background:var(--stamp);color:var(--on-stamp);font-weight:700;border-radius:999px;padding:8px 14px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.settings p{color:var(--ink-2);margin:6px 0 0}
.sync-err{color:var(--bad);font-weight:600}
.sync-ok{color:var(--ok);font-weight:600}
.fine-note{font-size:14px;color:var(--ink-2)}
#syncbox .inp{margin-top:10px}
.settings .group{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.settings h3{margin:0;font-size:17px}
.meter{font-family:var(--mono);font-size:14px;color:var(--ink-2)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <h1 class="mark">
        <svg viewBox="0 0 40 40" aria-hidden="true"><g transform="rotate(-14 20 20)" fill="none" stroke="var(--stamp)"><circle cx="20" cy="20" r="16" stroke-width="2.6"/><circle cx="20" cy="20" r="11.5" stroke-width="1.2" stroke-dasharray="2.4 2"/></g><path d="M14 24c2.6-7.6 10.6-10 14.6-6" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/></svg>
        Carimbo
      </h1>
      <button class="icon-btn" data-act="settings" aria-label="Sincronizar, backup e ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4 4 0 0 1-.5 8.5H7z"/><path d="M10 13.5l2-2 2 2M12 11.5V16"/></svg>
      </button>
    </div>
    <p class="next" id="next"></p>
  </div>
  <div class="guil" id="guil"></div>
</header>

<main id="app" class="wrap" aria-live="polite"></main>
<input type="file" id="addfile" accept="image/*,application/pdf" multiple class="sr" tabindex="-1" aria-hidden="true">

<div class="fab" id="fab"></div>

<dialog id="form"></dialog>
<dialog id="viewer"></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="extract.js"></script>
<script src="sync.js"></script>
<script>
/* ---------- Dados ---------- */
const TYPES = {
  passport:  { l:'Passaporte',            c:'P', col:'#1F3B73' },
  visa:      { l:'Visto',                 c:'V', col:'#6A3FC4' },
  id:        { l:'Identidade / CNH',      c:'I', col:'#2B6CB0' },
  ticket:    { l:'Passagem',              c:'T', col:'#0F7C86' },
  stay:      { l:'Hospedagem',            c:'H', col:'#B0661A' },
  tour:      { l:'Tour',                  c:'R', col:'#A3367A' },
  insurance: { l:'Seguro viagem',         c:'S', col:'#1D7A55' },
  money:     { l:'Comprovante financeiro',c:'F', col:'#5A6880' },
  health:    { l:'Saúde e vacinas',       c:'M', col:'#B42335' },
  other:     { l:'Outro',                 c:'D', col:'#6B7280' },
};
const ORDER = Object.keys(TYPES);
const TYPE_ICONS = {
  passport:  '<rect x="5" y="2.5" width="14" height="19" rx="2"/><circle cx="12" cy="10" r="3.6"/><path d="M8.4 10h7.2M12 6.4c1.3 1.1 1.3 6.1 0 7.2M12 6.4c-1.3 1.1-1.3 6.1 0 7.2M9 17.5h6"/>',
  visa:      '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.8" stroke-dasharray="2.2 2"/><path d="M9.6 12.2l1.7 1.7 3.2-3.6"/>',
  id:        '<rect x="2.5" y="5" width="19" height="14" rx="2.2"/><circle cx="8.5" cy="10.8" r="2.2"/><path d="M5.4 16.2c.6-1.7 1.7-2.6 3.1-2.6s2.5.9 3.1 2.6M14.5 10h4.5M14.5 13.5h3.5"/>',
  ticket:    '<path d="M10.5 3.6a1.5 1.5 0 0 1 3 0V9l7.5 4.5v2l-7.5-2.2V18l2 1.6V21L12 20l-3.5 1v-1.4l2-1.6v-4.7L3 15.5v-2L10.5 9z"/>',
  stay:      '<path d="M3 18.5v-13M3 14.5h18v4M21 14.5v-2.8a3 3 0 0 0-3-3h-6.5v5.8"/><circle cx="7.2" cy="11" r="2"/>',
  tour:      '<path d="M12 21.2s-6.8-5.8-6.8-11.4a6.8 6.8 0 0 1 13.6 0c0 5.6-6.8 11.4-6.8 11.4z"/><circle cx="12" cy="9.8" r="2.5"/>',
  insurance: '<path d="M12 2.8l7.5 3v6c0 4.6-3.2 8.1-7.5 9.4-4.3-1.3-7.5-4.8-7.5-9.4v-6z"/><path d="M9 12l2.1 2.1L15 10.2"/>',
  money:     '<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.8"/><path d="M6 9.5v5M18 9.5v5"/>',
  health:    '<path d="M9.5 3.5h5v6h6v5h-6v6h-5v-6h-6v-5h6z"/>',
  other:     '<path d="M6 2.5h8l4.5 4.5v14.5H6z"/><path d="M14 2.5V7h4.5M9 12.5h6M9 16h6"/>',
};
const typeIcon = k => `<svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${TYPE_ICONS[k] || TYPE_ICONS.other}</svg>`;
// Campos de cada categoria. 'big' aparece em destaque. number/expires ficam no documento; o resto em d.x
const FIELDS = {
  passport:  [['number', 'Número', 'big'], ['issued', 'Emissão', 'date', 1], ['expires', 'Validade', 'date', 1]],
  visa:      [['place', 'Local', 'wide', 1], ['number', 'Número', 'big'], ['expires', 'Validade', 'date', 1]],
  id:        [['number', 'Número', 'big'], ['expires', 'Validade', 'date', 1]],
  ticket:    [['route', 'Trecho', 'wide'], ['number', 'Localizador', 'big'], ['flight', 'Voo', '', 1], ['seat', 'Poltrona', '', 1], ['gate', 'Portão', '', 1], ['terminal', 'Terminal', '', 1], ['group', 'Grupo', '', 1], ['boarding', 'Embarque', 'datetime', 1], ['departure', 'Decolagem', 'datetime', 1], ['arrival', 'Chegada', 'datetime', 1], ['class', 'Classe'], ['baggage', 'Bagagem despachada'], ['eticket', 'Nº do bilhete', 'wide']],
  stay:      [['number', 'Localizador', 'big'], ['hotel', 'Hotel', 'wide'], ['address', 'Endereço', 'wide'], ['checkin', 'Check-in', 'date', 1], ['checkout', 'Check-out', 'date', 1], ['checkinTime', 'Entrada', 'time', 1], ['checkoutTime', 'Saída', 'time', 1], ['nights', 'Noites', '', 1], ['total', 'Valor total'], ['phone', 'Telefone', 'tel']],
  tour:      [['number', 'Localizador', 'big'], ['what', 'O que é', '', 1], ['date', 'Data', 'date', 1], ['time', 'Horário', 'time', 1], ['meeting', 'Ponto de encontro', 'wide']],
  insurance: [['number', 'Número da apólice', 'big'], ['value', 'Valor da apólice', '', 1], ['expires', 'Válido até', 'date', 1], ['phone', 'Telefone de emergência', 'tel']],
  health:    [['what', 'O que é', 'wide'], ['number', 'Número', 'big'], ['date', 'Data', 'date', 1]],
  money:     [['value', 'Valor', 'big'], ['place', 'Local', 'wide', 1], ['date', 'Data', 'date', 1]],
  other:     [['number', 'Número', 'big'], ['expires', 'Validade', 'date', 1]],
};
const CORE = new Set(['number', 'expires']);
const fieldsOf = t => FIELDS[t] || FIELDS.other;
const fval = (d, k) => (CORE.has(k) ? d[k] : d.x?.[k]) || '';
const bigField = d => fieldsOf(d.type).find(f => f[2] === 'big');
const CHECK_TEMPLATE = [
  'Passaporte com 6+ meses de validade',
  'Formulário do visto preenchido e impresso',
  'Foto no padrão do consulado',
  'Comprovante de renda e extratos',
  'Seguro viagem',
  'Reserva de hospedagem',
  'Passagem de ida e volta',
  'Comprovante de pagamento da taxa',
];

const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k) } catch { return null } },
  set(k,v){ try { localStorage.setItem(k,v) } catch {} },
};

/* IndexedDB: tudo fica só neste aparelho */
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('carimbo', 2);
  r.onupgradeneeded = () => {
    const db = r.result;
    if (!db.objectStoreNames.contains('docs')) db.createObjectStore('docs',  { keyPath:'id' });
    if (!db.objectStoreNames.contains('trips')) db.createObjectStore('trips', { keyPath:'id' });
    if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
  };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function tx(name, mode, fn){
  const db = await dbp;
  return new Promise((res, rej) => {
    const t = db.transaction(name, mode), s = t.objectStore(name), req = fn(s);
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
  });
}
const dbAll = n => tx(n, 'readonly', s => s.getAll());
const dbPut = (n, v) => tx(n, 'readwrite', s => s.put(v));
const dbDel = (n, id) => tx(n, 'readwrite', s => s.delete(id));
const metaGet = k => tx('meta', 'readonly', s => s.get(k));
const metaPut = (k, v) => tx('meta', 'readwrite', s => s.put(v, k));
// O que a sincronização (sync.js) usa do app
window.CarimboStore = {
  dbAll, dbPut, dbDel, metaGet, metaPut, reload: () => load(),
  getFlag: () => store.get('carimbo.sync') === '1', setFlag: on => store.set('carimbo.sync', on ? '1' : ''),
};

const state = { docs:[], trips:[], filter: store.get('carimbo.filter') || 'all' };

/* ---------- Utilidades de data ---------- */
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d };
const toDate = s => new Date(s + 'T00:00');
const days = s => Math.round((toDate(s) - today()) / 864e5);
const fmt = (s, y = true) => s ? toDate(s).toLocaleDateString('pt-BR', { day:'numeric', month:'short', ...(y ? { year:'numeric' } : {}) }).replace('.', '') : '';
const fshort = (kind, v) => !v ? '' : kind === 'date' ? fmt(v, false) : kind === 'datetime' ? (v.slice(0, 10) === (window.__day || '') ? v.slice(11, 16) : `${fmt(v.slice(0, 10), false)}, ${v.slice(11, 16)}`) : v;
const fshow = (kind, v) => !v ? '' : kind === 'date' ? fmt(v) : kind === 'datetime' ? `${fmt(v.slice(0, 10))}, ${v.slice(11, 16)}` : v;

function status(d){
  if (!d.expires || !fieldsOf(d.type).some(f => f[0] === 'expires')) return null;
  const n = days(d.expires);
  if (n < 0) return { k:'bad', t:'Vencido' };
  const limit = d.type === 'passport' ? 183 : 30;
  if (n <= limit) return { k:'warn', t: n <= 60 ? `Vence em ${n} ${n === 1 ? 'dia' : 'dias'}` : `Vence em ${Math.round(n/30)} meses` };
  return { k:'ok', t:`Válido até ${fmt(d.expires)}` };
}

function mrz(d){
  const clean = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]+/g, '<');
  const line = `${TYPES[d.type]?.c || 'D'}<${clean(d.number) || '<<<<<<'}<<${clean(d.holder || d.title)}<<${(d.expires || '').replace(/-/g, '').slice(2)}`;
  return (line + '<'.repeat(60)).slice(0, 60);
}

const urls = new WeakMap();
const blobUrl = b => { if (!urls.has(b)) urls.set(b, URL.createObjectURL(b)); return urls.get(b) };
const pic = d => { const fs = d.files || []; return fs.find(f => f.type.startsWith('image/'))?.blob || fs.find(f => f.thumb)?.thumb };

/* ---------- Render ---------- */
function sortDocs(a, b){
  return (ORDER.indexOf(a.type) - ORDER.indexOf(b.type)) || a.title.localeCompare(b.title);
}
function tripsSorted(){
  return state.trips.slice().sort((a, b) => (a.start || '9999').localeCompare(b.start || '9999'));
}
function tripWhen(t){
  if (!t.start) return '';
  const a = fmt(t.start, !t.end), b = t.end ? fmt(t.end) : '';
  return b ? `${a} a ${b}` : a;
}

function renderNext(){
  const now = today();
  const active = state.trips.find(t => t.start && toDate(t.start) <= now && (!t.end || toDate(t.end) >= now));
  const up = tripsSorted().find(t => t.start && toDate(t.start) > now);
  const el = $('#next');
  if (active) el.innerHTML = `Você está em <b>${esc(active.name)}</b>. Boa viagem.`;
  else if (up) { const n = days(up.start); el.innerHTML = `<b>${esc(up.name)}</b> ${n === 1 ? 'é amanhã' : `em ${n} dias`}.`; }
  else el.textContent = state.docs.length ? `${state.docs.length} ${state.docs.length === 1 ? 'documento guardado' : 'documentos guardados'} neste aparelho.` : 'Seus documentos de viagem, sempre à mão. Funciona sem internet.';
}

function summary(d){
  const x = d.x || {};
  switch (d.type) {
    case 'ticket': return [x.departure && fshow('datetime', x.departure), x.seat && `Poltrona ${x.seat}`, x.gate && `Portão ${x.gate}`];
    case 'stay': return [x.checkin && (x.checkout ? `${fmt(x.checkin, false)} a ${fmt(x.checkout)}` : fmt(x.checkin))];
    case 'tour': return [x.date && fmt(x.date), x.time];
    case 'health': case 'money': return [x.date && fmt(x.date)];
    case 'visa': return [x.place];
    case 'insurance': return [x.value];
    default: return [];
  }
}
// Data do voo, quando o cartão mostra só os horários
const flightDay = d => { const t = d.type === 'ticket' && (d.x?.departure || d.x?.boarding); return t ? toDate(t.slice(0, 10)).toLocaleDateString('pt-BR', { weekday:'short', day:'numeric', month:'short', year:'numeric' }).replace(/\./g, '') : '' };
function boxes(d){
  const st = status(d);
  const list = fieldsOf(d.type).filter(f => f[3] && fval(d, f[0]) && !(f[0] === 'expires' && st && st.k !== 'ok'));
  // embarque/decolagem/chegada no mesmo dia: mostra só a hora
  const days = new Set(list.filter(f => f[2] === 'datetime').map(f => fval(d, f[0]).slice(0, 10)));
  window.__day = days.size === 1 ? [...days][0] : '';
  const html = list.map(([k, l, kind]) => `<span class="box${kind === 'wide' ? ' wide' : ''}"><small>${l}</small><b>${esc(fshort(kind, fval(d, k)))}</b></span>`).join('');
  window.__day = '';
  return html ? `<span class="boxes">${html}</span>` : '';
}
function docCard(d){
  const t = TYPES[d.type] || TYPES.other, st = status(d), bf = bigField(d), bv = bf && fval(d, bf[0]);
  const trip = d.tripId && state.trips.find(x => x.id === d.tripId);
  return `<div class="doc-wrap"><button class="doc${d.number ? '' : ' plain'}" style="--tc:${t.col}" data-act="open" data-id="${d.id}">
    <span class="thumb">${typeIcon(d.type)}</span>
    <span class="doc-main">
      <span class="doc-title">${esc(d.title)}</span>
      ${bv ? `<span class="doc-num">${esc(bv)}</span>` : ''}
      <span class="tags">${st && st.k !== 'ok' ? `<span class="tag ${st.k}">${st.t}</span>` : ''}${flightDay(d) ? `<span class="tag day">${flightDay(d)}</span>` : ''}${state.filter === 'all' && trip ? `<span class="tag">${esc(trip.name)}</span>` : ''}${(d.files||[]).length > 1 ? `<span class="tag">${d.files.length} arquivos</span>` : ''}</span>
    </span>
    ${boxes(d)}
    ${d.number ? `<span class="mrz" aria-hidden="true">${esc(mrz(d))}</span>` : ''}
  </button><button class="doc-del" data-act="del-doc" data-id="${d.id}" aria-label="Excluir ${esc(d.title)}">${ICON.trash}</button></div>`;
}

function render(){
  renderNext();
  const f = state.filter;
  const trip = state.trips.find(t => t.id === f);
  if (f !== 'all' && f !== 'personal' && !trip) { state.filter = 'all'; return render(); }

  let docs = state.docs.slice().sort(sortDocs);
  if (f === 'personal') docs = docs.filter(d => !d.tripId);
  else if (trip) docs = docs.filter(d => d.tripId === trip.id);

  const chip = (id, label, n) => `<button class="chip" aria-pressed="${f === id}" data-act="filter" data-id="${id}">${esc(label)}${n != null ? `<small>${n}</small>` : ''}</button>`;
  let h = `<nav class="chips" aria-label="Filtrar documentos">
    ${chip('all', 'Tudo', state.docs.length)}
    ${chip('personal', 'Pessoais', state.docs.filter(d => !d.tripId).length)}
    ${tripsSorted().map(t => chip(t.id, t.name, state.docs.filter(d => d.tripId === t.id).length)).join('')}
    <button class="chip add" data-act="new-trip">+ Nova viagem</button>
  </nav>`;

  if (trip) h += tripPanel(trip, docs);

  if (f === 'all') {
    const issues = state.docs.map(d => [d, status(d)]).filter(([, s]) => s && s.k !== 'ok');
    if (issues.length) {
      const bad = issues.some(([, s]) => s.k === 'bad');
      h += `<div class="alert ${bad ? 'bad' : ''}" role="alert"><strong>${issues.length === 1 ? '1 documento precisa' : `${issues.length} documentos precisam`} de atenção</strong>
        ${issues.map(([d, s]) => `<button data-act="open" data-id="${d.id}">${esc(d.title)}</button>: ${s.t.toLowerCase()}`).join('<br>')}
        ${issues.some(([d]) => d.type === 'passport') ? '<br><small>Muitos países exigem passaporte válido por 6 meses após a entrada.</small>' : ''}</div>`;
    }
    const pinned = docs.filter(d => d.pinned);
    if (pinned.length) {
      h += `<h2 class="sec">À mão <button class="link" data-act="present" data-id="pinned">Apresentar</button></h2>
      <div class="hand">${pinned.map(d => { const t = TYPES[d.type] || TYPES.other, img = pic(d);
        return `<button class="tile" style="--tc:${t.col}" data-act="open" data-id="${d.id}">${img ? `<img src="${blobUrl(img)}" alt="">` : `<span class="big-ic">${typeIcon(d.type)}</span>`}<span class="t">${esc(d.title)}</span><span class="n">${esc(d.number || t.l)}</span></button>` }).join('')}</div>`;
    }
  }

  if (docs.length) {
    h += ORDER.filter(k => docs.some(d => d.type === k)).map(k => {
      const group = docs.filter(d => d.type === k);
      return `<section class="group" style="--tc:${TYPES[k].col}"><h2 class="sec"><span class="gi">${typeIcon(k)}</span>${TYPES[k].l}<small>${group.length}</small></h2><div class="list">${group.map(docCard).join('')}</div></section>`;
    }).join('');
    h += `<button class="link-plain" data-act="kind-blank">Adicionar sem arquivo, preenchendo à mão</button>`;
  } else {
    h += `<div class="empty">
      <svg viewBox="0 0 120 120" aria-hidden="true"><g transform="rotate(-12 60 60)" fill="none" stroke="currentColor"><circle cx="60" cy="60" r="44" stroke-width="5"/><circle cx="60" cy="60" r="33" stroke-width="2" stroke-dasharray="5 4"/></g><text x="60" y="66" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="15" font-weight="600" fill="currentColor" transform="rotate(-12 60 60)">VAZIO</text></svg>
      <h3>${trip ? 'Nada nesta viagem ainda' : f === 'personal' ? 'Nenhum documento pessoal' : 'Comece pelo passaporte'}</h3>
      <p>${trip ? 'Adicione o visto, as passagens e as reservas. Na fila da embaixada, tudo estará aqui, mesmo sem sinal.' : 'Toque em Adicionar documento e tire uma foto ou escolha o PDF. O Carimbo descobre o que é e preenche tudo. Fica só neste aparelho e abre sem internet.'}</p>
    </div>`;
  }

  $('#app').innerHTML = h;
  $('#fab').innerHTML = `<div class="wrap">${trip && docs.length ? `<button class="btn stamp" data-act="present" data-id="${trip.id}">${ICON.present}Apresentar</button>` : ''}<button class="btn primary" data-act="new-doc">${ICON.plus}${trip && docs.length ? "Adicionar" : "Adicionar documento"}</button></div>`;
}

function tripPanel(t, docs){
  const list = t.checklist || [], done = list.filter(c => c.done).length;
  return `<section class="trip" aria-label="Viagem">
    <h2>${esc(t.name)}</h2>
    <p class="when">${tripWhen(t) || 'Sem data definida'}${t.start && days(t.start) > 0 ? `, faltam ${days(t.start)} dias` : ''}</p>
    ${t.notes ? `<p class="when">${esc(t.notes)}</p>` : ''}
    ${list.length ? `<div class="progress" aria-hidden="true"><i style="width:${done / list.length * 100}%"></i></div>
    <span class="pcount">${done} de ${list.length} itens prontos</span>` : ''}
    <ul class="checks">${list.map(c => `<li class="${c.done ? 'done' : ''}">
      <label><input type="checkbox" data-act="check" data-id="${c.id}" ${c.done ? 'checked' : ''}><span>${esc(c.label)}</span></label>
      <button class="x" data-act="uncheck-del" data-id="${c.id}" aria-label="Remover ${esc(c.label)}">×</button></li>`).join('')}</ul>
    <form class="addcheck" data-form="addcheck"><input class="inp" name="label" placeholder="Adicionar item à lista" aria-label="Novo item da lista" autocomplete="off"><button class="btn ghost sm">Adicionar</button></form>
    <div class="row-btns"><button class="btn ghost sm" data-act="edit-trip" data-id="${t.id}">Editar viagem</button></div>
  </section>`;
}

const ICON = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  present: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10 18h4"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5A1.5 1.5 0 0 0 8.5 21h7a1.5 1.5 0 0 0 1.5-1.5L18 7M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
};

/* ---------- Formulário de documento ---------- */
let draftFiles = [], draftText = '', draftX = {}, readToken = 0, skipFiles = [], skipExisting = null;

// Adicionar: abre direto a câmera/arquivos. O tipo o Carimbo descobre sozinho.
function addDoc(){ Extract.warm(); $('#addfile').click() }

async function readNewDoc(fileList, existing){
  const token = ++readToken, dlg = $('#form');
  dlg.innerHTML = `<div class="sheet">
    <div class="sheet-h"><h2>${existing ? 'Lendo de novo' : 'Novo documento'}</h2><button type="button" class="icon-btn" data-act="close" aria-label="Fechar">${ICON.close}</button></div>
    <div class="sheet-b"><div class="reading" role="status">
      <svg viewBox="0 0 120 120" aria-hidden="true"><g class="ring" fill="none" stroke="currentColor"><circle cx="60" cy="60" r="44" stroke-width="5"/><circle cx="60" cy="60" r="33" stroke-width="2" stroke-dasharray="5 4"/></g></svg>
      <h3>Lendo o documento</h3>
      <p id="readstatus">Abrindo o arquivo…</p>
      <p class="fine">Tudo acontece neste celular. Nada é enviado.</p>
      <button type="button" class="link-plain" data-act="skip-read">Pular e preencher à mão</button>
    </div></div></div>`;
  if (!dlg.open) dlg.showModal();
  const files = [];
  for (const f of fileList) files.push(await prepFile(f));
  skipFiles = files; skipExisting = existing || null;
  let res;
  try {
    // documento vazio (ou genérico): descobre o tipo de novo; se já tem dados, mantém o tipo
    const keepType = existing && existing.type !== 'other' && (existing.number || Object.values(existing.x || {}).some(Boolean));
    res = await Extract.read(files, keepType ? existing.type : '', msg => { const s = $('#readstatus'); if (s && token === readToken) s.textContent = msg });
  } catch (e) { res = { type: existing?.type || 'other', filled: [], x: {}, failed: true } }
  if (token !== readToken) return;
  if (existing) {
    // Mantém o que já estava preenchido; completa o resto
    // título genérico ("Passagem", "Outro"...) pode ser trocado pelo que foi lido
    const has = (k, v) => v && !(k === 'title' && Object.values(TYPES).some(t => t.l === v));
    const keep = Object.fromEntries(['title', 'number', 'holder', 'expires', 'notes'].map(k => [k, has(k, existing[k]) ? existing[k] : res[k]]));
    const x = { ...res.x }; for (const [k, v] of Object.entries(existing.x || {})) if (v) x[k] = v;
    const filled = res.filled.filter(k => k.startsWith('x.') ? x[k.slice(2)] === res.x[k.slice(2)] : keep[k] === res[k]);
    return openDocForm({ ...existing, ...keep, x, type: res.type }, { ...res, filled, detected: res.type !== existing.type });
  }
  openDocForm(null, { ...res, files });
}

function matchTrip(dates){
  if (!dates?.length) return '';
  for (const t of state.trips) {
    if (!t.start) continue;
    const a = +toDate(t.start) - 3 * 864e5, b = +toDate(t.end || t.start) + 3 * 864e5;
    if (dates.some(d => { const x = +toDate(d); return x >= a && x <= b })) return t.id;
  }
  return '';
}

function fieldsHTML(type, d, auto = new Set()){
  return `<div class="fgrid">${fieldsOf(type).map(([k, l, kind]) => {
    const v = fval(d, k), name = CORE.has(k) ? k : 'x_' + k;
    const a = auto.has(CORE.has(k) ? k : 'x.' + k) ? ' auto' : '';
    const input = kind === 'date' ? `<input class="inp${a}" type="date" name="${name}" value="${esc(v)}">`
      : kind === 'datetime' ? `<input class="inp${a}" type="datetime-local" name="${name}" value="${esc(v)}">`
      : kind === 'time' ? `<input class="inp${a}" type="time" name="${name}" value="${esc(v)}">`
      : kind === 'tel' ? `<input class="inp${a}" type="tel" name="${name}" value="${esc(v)}">`
      : k === 'address' ? `<textarea class="inp${a}" name="${name}" rows="2">${esc(v)}</textarea>`
      : `<input class="inp${kind === 'big' ? ' mono' : ''}${a}" name="${name}" value="${esc(v)}" autocomplete="off"${kind === 'big' ? ' autocapitalize="characters" spellcheck="false"' : ''}>`;
    return `<label class="field${kind === 'big' || kind === 'wide' || kind === 'tel' ? ' wide' : ''}"><span>${l}</span>${input}</label>`;
  }).join('')}</div>`;
}
function collect(form){
  const d = { x: {} };
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.name.startsWith('x_')) d.x[el.name.slice(2)] = el.value.trim();
    else if (CORE.has(el.name)) d[el.name] = el.value.trim();
  }
  return d;
}

function openDocForm(doc, pre){
  const filterTrip = state.trips.some(t => t.id === state.filter) ? state.filter : '';
  const type = doc?.type || pre?.type || 'other';
  const d = doc || {
    id: uid(), type, title: pre?.title || '', number: pre?.number || '', x: pre?.x || {},
    holder: pre?.holder || (['passport', 'id', 'visa'].includes(type) ? store.get('carimbo.holder') : '') || '',
    expires: pre?.expires || '', notes: pre?.notes || '',
    tripId: filterTrip || (['ticket', 'stay', 'tour', 'insurance', 'visa'].includes(type) ? matchTrip(pre?.dates) : ''),
    pinned: type === 'passport' && !state.docs.some(x => x.pinned && x.type === 'passport'), files: pre?.files || [],
  };
  draftFiles = (d.files || []).slice();
  draftText = pre?.text || doc?.text || '';
  draftX = { ...(d.x || {}) };
  const auto = new Set(pre?.filled || []);
  const matched = pre && !doc && !filterTrip && d.tripId;
  const n = auto.size;
  const banner = !pre || pre.skipped ? ''
    : pre.failed ? '<p class="auto-note warn">Não consegui abrir o leitor agora. O arquivo está guardado; complete o que precisar.</p>'
    : pre.detected ? `<p class="auto-note">Identifiquei como <b>${TYPES[d.type].l}</b>${n ? ` e preenchi ${n === 1 ? 'o campo destacado' : `os ${n} campos destacados`}` : ', mas não achei os dados'}${matched ? ', na viagem certa' : ''}. Confira e toque em Salvar. Se o tipo estiver errado, troque abaixo.</p>`
    : n ? `<p class="auto-note">Preenchi ${n === 1 ? 'o campo destacado' : `os ${n} campos destacados`} lendo o documento. Confira e toque em Salvar.</p>`
    : '<p class="auto-note warn">Não encontrei os dados neste arquivo. Complete o que precisar.</p>';
  const dlg = $('#form');
  dlg.innerHTML = `<form class="sheet" data-form="doc" data-id="${d.id}">
    <div class="sheet-h"><h2>${doc ? 'Editar documento' : 'Novo documento'}</h2><button type="button" class="icon-btn" data-act="close" aria-label="Fechar">${ICON.close}</button></div>
    <div class="sheet-b">
      ${banner}
      <fieldset class="field" style="border:0;padding:0;margin-inline:0"><legend style="font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:6px">Tipo</legend>
        <div class="types">${ORDER.map(k => `<label style="--tc:${TYPES[k].col}"><input type="radio" name="type" value="${k}" ${d.type === k ? 'checked' : ''}><span>${typeIcon(k)}${TYPES[k].l}</span></label>`).join('')}</div>
      </fieldset>
      <label class="field"><span>Nome</span><input class="inp${auto.has('title') ? ' auto' : ''}" name="title" value="${esc(d.title)}" placeholder="${esc(TYPES[d.type].l)}" autocomplete="off"></label>
      <div id="fieldbox">${fieldsHTML(d.type, d, auto)}</div>
      ${pre?.mrz && pre.numberOk === false ? '<small class="hint">Confira o número: a foto pode ter atrapalhado a leitura.</small>' : ''}
      <label class="field"><span>Titular</span><input class="inp${auto.has('holder') ? ' auto' : ''}" name="holder" value="${esc(d.holder)}" autocomplete="name"></label>
      <label class="field"><span>Viagem</span><select class="inp${matched ? ' auto' : ''}" name="tripId"><option value="">Pessoal (todas as viagens)</option>${tripsSorted().map(t => `<option value="${t.id}" ${d.tripId === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></label>
      <label class="field"><span>Observações</span><textarea class="inp${auto.has('notes') ? ' auto' : ''}" name="notes" placeholder="Ex.: original fica na pasta azul">${esc(d.notes)}</textarea></label>
      <div class="field"><span>Arquivos</span>
        <div class="pick">
          <label class="btn ghost sm"><input type="file" accept="image/*" capture="environment" data-pick>Tirar foto</label>
          <label class="btn ghost sm"><input type="file" accept="image/*,application/pdf" multiple data-pick>Escolher foto ou PDF</label>
        </div>
        <div class="files" id="files"></div>
        <small id="pickstatus" role="status"></small>
      </div>
      <label class="switch"><input type="checkbox" name="pinned" ${d.pinned ? 'checked' : ''}>Mostrar em “À mão”, no topo da tela inicial</label>
      ${doc ? `<div class="row-btns"><button type="button" class="btn danger sm" data-act="del-doc" data-id="${d.id}">Excluir documento</button></div>` : ''}
    </div>
    <div class="sheet-f"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn primary grow">Salvar documento</button></div>
  </form>`;
  drawFiles();
  if (!dlg.open) dlg.showModal();
}

// Trocou o tipo no formulário: mostra os campos certos e tenta preenchê-los com o texto já lido
function changeType(form, type){
  const cur = collect(form);
  const d = { number: cur.number ?? form.dataset.number ?? '', expires: cur.expires ?? '', x: { ...draftX, ...Object.fromEntries(Object.entries(cur.x).filter(([, v]) => v)) } };
  const auto = new Set();
  if (draftText) {
    const r = Extract.fromText(type, draftText);
    for (const k of ['number', 'expires']) if (r[k] && !d[k]) { d[k] = r[k]; auto.add(k) }
    for (const [k, v] of Object.entries(r.x || {})) if (v && !d.x[k]) { d.x[k] = v; auto.add('x.' + k) }
    if (r.title && (!form.title.value || form.title.classList.contains('auto'))) { form.title.value = r.title; form.title.classList.add('auto') }
  }
  draftX = d.x;
  if (cur.number !== undefined) form.dataset.number = cur.number;
  $('#fieldbox').innerHTML = fieldsHTML(type, d, auto);
  form.title.placeholder = TYPES[type].l;
}

async function readIntoForm(files){
  const form = $('[data-form=doc]'), st = $('#pickstatus'); if (!form) return;
  const type = new FormData(form).get('type') || 'other';
  try {
    const r = await Extract.read(files, type, m => { if (st) st.textContent = m });
    let n = 0;
    const pairs = [...['title', 'number', 'holder', 'expires', 'notes'].map(k => [k, r[k]]), ...Object.entries(r.x || {}).map(([k, v]) => ['x_' + k, v])];
    for (const [k, v] of pairs) {
      const inp = form.elements[k];
      if (v && inp && !inp.value.trim()) { inp.value = v; inp.classList.add('auto'); n++ }
    }
    if (r.text) draftText = (draftText + '\n' + r.text).slice(0, 8000);
    if (st) st.textContent = n ? `Preenchi ${n === 1 ? '1 campo' : `${n} campos`} a partir do arquivo.` : '';
  } catch { if (st) st.textContent = '' }
}

function drawFiles(){
  const el = $('#files'); if (!el) return;
  el.innerHTML = draftFiles.map((f, i) => `<div class="fthumb">${f.type.startsWith('image/') ? `<img src="${blobUrl(f.blob)}" alt="${esc(f.name)}">` : 'PDF'}<button type="button" data-act="rm-file" data-i="${i}" aria-label="Remover ${esc(f.name)}">×</button></div>`).join('');
}

async function prepFile(file){
  if (!file.type.startsWith('image/') || file.type === 'image/gif' || file.type === 'image/svg+xml') return { name:file.name, type:file.type || 'application/octet-stream', blob:file };
  try {
    const bmp = await createImageBitmap(file, { imageOrientation:'from-image' });
    const s = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .88));
    if (!blob) throw 0;
    return { name: file.name.replace(/\.\w+$/, '') + '.jpg', type:'image/jpeg', blob };
  } catch { return { name:file.name, type:file.type, blob:file } }
}

async function saveDoc(form){
  const fd = new FormData(form), id = form.dataset.id;
  const old = state.docs.find(d => d.id === id);
  const type = fd.get('type') || 'other';
  const d = {
    ...(old || { createdAt: Date.now() }),
    id, type,
    title: fd.get('title').trim() || TYPES[type].l,
    number: (fd.get('number') || '').trim().toUpperCase(),
    holder: fd.get('holder').trim(),
    expires: fd.get('expires') || '',
    x: Object.fromEntries(Object.entries({ ...draftX, ...collect(form).x }).filter(([k, v]) => v && fieldsOf(type).some(f => f[0] === k))),
    tripId: fd.get('tripId') || '',
    notes: fd.get('notes').trim(),
    pinned: fd.get('pinned') === 'on',
    files: draftFiles,
    text: draftText || old?.text || '',
    updatedAt: Date.now(),
  };
  for (const f of d.files) if (f.type === 'application/pdf' && !f.thumb) f.thumb = await Extract.pdfThumb(f.blob).catch(() => null);
  if (d.holder && (type === 'passport' || type === 'id')) store.set('carimbo.holder', d.holder);
  try { await dbPut('docs', d) } catch (e) { return toast('Não foi possível salvar: espaço cheio no aparelho') }
  state.docs = state.docs.filter(x => x.id !== id).concat(d);
  Sync.changed();
  $('#form').close(); render(); toast(old ? 'Documento atualizado' : 'Documento salvo');
}

async function saveTrip(form){
  const fd = new FormData(form), id = form.dataset.id, old = state.trips.find(t => t.id === id);
  const t = { ...(old || { checklist: fd.get('template') === 'on' ? CHECK_TEMPLATE.map(label => ({ id:uid(), label, done:false })) : [] }),
    id, name: fd.get('name').trim(), start: fd.get('start'), end: fd.get('end'), notes: fd.get('notes').trim(), updatedAt: Date.now() };
  await dbPut('trips', t); Sync.changed();
  state.trips = state.trips.filter(x => x.id !== id).concat(t);
  setFilter(id); $('#form').close(); toast(old ? 'Viagem atualizada' : 'Viagem criada');
}

async function updateTrip(t){ t.updatedAt = Date.now(); await dbPut('trips', t); Sync.changed(); state.trips = state.trips.map(x => x.id === t.id ? t : x); render(); }

/* ---------- Visualizador / Modo apresentar ---------- */
let seq = [], pos = 0, presenting = false, wake = null;

function openViewer(ids, i = 0, present = false){
  seq = ids; pos = i; presenting = present;
  drawViewer();
  const v = $('#viewer'); if (!v.open) v.showModal();
  if (present && 'wakeLock' in navigator) navigator.wakeLock.request('screen').then(w => wake = w).catch(() => {});
}
const pdfImgs = new WeakMap();
function closeViewer(){ $('#viewer').close(); }
$('#viewer').addEventListener('close', () => { if (wake) { wake.release().catch(() => {}); wake = null } $('#viewer').innerHTML = '' });

function drawViewer(){
  const d = state.docs.find(x => x.id === seq[pos]); if (!d) return closeViewer();
  const t = TYPES[d.type] || TYPES.other, st = status(d), trip = state.trips.find(x => x.id === d.tripId);
  const files = d.files || [], bf = bigField(d), bv = bf && fval(d, bf[0]);
  $('#viewer').innerHTML = `<div class="v ${presenting ? 'present' : ''}">
    <div class="v-h"><button class="icon-btn" data-act="close" aria-label="Fechar">${ICON.close}</button><h2>${esc(d.title)}</h2><button class="btn ghost sm" data-act="edit-doc" data-id="${d.id}">Editar</button></div>
    <div class="v-body">
      ${bv ? `<div class="info top"><div class="big-num"><div><small>${bf[1]}</small><strong>${esc(bv)}</strong></div><button class="icon-btn" data-act="copy" data-v="${esc(bv)}" aria-label="Copiar ${bf[1].toLowerCase()}">${ICON.copy}</button></div></div>` : ''}
      <div class="slides" id="slides">${files.length ? files.map(f => f.type.startsWith('image/')
        ? `<div class="slide"><img src="${blobUrl(f.blob)}" alt="${esc(d.title)}"></div>`
        : `<a class="slide pdfpage" href="${blobUrl(f.blob)}" target="_blank" rel="noopener" aria-label="Abrir ${esc(f.name)} completo"><img data-pdf="${files.indexOf(f)}" alt="Primeira página de ${esc(d.title)}"></a>`).join('')
        : `<div class="slide nofile">Sem arquivo anexado. Toque em Editar para adicionar uma foto ou PDF.</div>`}</div>
      ${files.length > 1 ? `<div class="dots" id="dots">${files.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>` : ''}
      <div class="info">
        ${files.some(f => !f.type.startsWith('image/')) ? `<div class="row-btns" style="margin-top:6px">${files.filter(f => !f.type.startsWith('image/')).map(f => `<a class="btn ghost sm" href="${blobUrl(f.blob)}" target="_blank" rel="noopener" download="${esc(f.name)}">Abrir o PDF completo</a>`).join('')}</div>` : ''}
        <div class="facts">
          ${fieldsOf(d.type).filter(f => f !== bf && fval(d, f[0])).map(([k, l, kind]) => `<div class="fact${kind === 'wide' || kind === 'tel' ? ' wide' : ''}${k === 'expires' && st ? ' ' + st.k : ''}"><small>${l}</small><b>${kind === 'tel' ? `<a href="tel:${esc(fval(d, k).replace(/[^\d+]/g, ''))}">${esc(fval(d, k))}</a>` : esc(fshow(kind, fval(d, k)))}</b></div>`).join('')}
          ${st && st.k !== 'ok' ? `<div class="fact ${st.k}"><small>Situação</small><b>${st.t}</b></div>` : ''}
          ${d.holder ? `<div class="fact"><small>Titular</small><b>${esc(d.holder)}</b></div>` : ''}
          ${trip ? `<div class="fact"><small>Viagem</small><b>${esc(trip.name)}</b></div>` : ''}
          ${d.notes ? `<div class="fact wide"><small>Observações</small><b class="notes">${esc(d.notes)}</b></div>` : ''}
        </div>
        ${presenting ? '' : `<div class="row-btns">${files.length ? `<button class="btn ghost sm" data-act="reread" data-id="${d.id}">Ler o documento de novo</button>` : ''}<button class="btn danger sm" data-act="del-doc" data-id="${d.id}">Excluir documento</button></div>`}
      </div>
    </div>
    ${seq.length > 1 ? `<div class="v-f"><button class="btn ghost sm" data-act="prev" ${pos ? '' : 'disabled'} aria-label="Documento anterior">‹ Anterior</button><span class="count">${pos + 1} de ${seq.length}</span><button class="btn ghost sm" data-act="nextdoc" ${pos < seq.length - 1 ? '' : 'disabled'} aria-label="Próximo documento">Próximo ›</button></div>` : ''}
  </div>`;
  // PDF: mostra só a 1ª página, como imagem limpa (sem a barra do leitor de PDF)
  $('#viewer').querySelectorAll('img[data-pdf]').forEach(async img => {
    const f = files[+img.dataset.pdf];
    if (!pdfImgs.has(f.blob)) pdfImgs.set(f.blob, Extract.pdfThumb(f.blob, 1400).then(b => URL.createObjectURL(b)));
    try { img.src = await pdfImgs.get(f.blob) } catch { img.closest('.slide').classList.add('nofile'); img.replaceWith('Não consegui mostrar este PDF. Toque em Abrir abaixo.') }
  });
  // Ações e links do arquivo vão para o fim, depois da imagem do documento
  const vb = $('#viewer .v-body'), end = document.createElement('div');
  end.className = 'info end'; vb.querySelectorAll('.info:not(.top) > .row-btns').forEach(r => end.append(r)); vb.append(end); vb.scrollTop = 0;
  const sl = $('#slides'), dots = $('#dots');
  if (sl && dots) sl.addEventListener('scroll', () => {
    const i = Math.round(sl.scrollLeft / sl.clientWidth);
    [...dots.children].forEach((el, j) => el.classList.toggle('on', i === j));
  }, { passive:true });
}

/* ---------- Sincronização (tela) ---------- */
let syncEmail = store.get('carimbo.email') || '', syncMode = store.get('carimbo.email') ? 'in' : 'up', syncSent = false;
function renderSync(msg = ''){
  const box = $('#syncbox'); if (!box) return;
  const st = Sync.state;
  const err = msg || st.error;
  const note = err ? `<p class="sync-err" role="alert">${esc(err)}</p>` : '';
  if (!st.signedIn || !st.unlocked) {
    const up = syncMode === 'up' && !st.signedIn;
    box.innerHTML = `<h3>Sincronizar entre aparelhos</h3>
      ${syncSent ? `<p class="sync-ok">Enviei um e-mail de confirmação para ${esc(syncEmail)}. Abra o link do e-mail e depois volte aqui e toque em Entrar.</p>`
        : `<p>${up ? 'Crie uma conta para ter os mesmos documentos no celular e no computador.' : 'Entre com seu e-mail e senha do Carimbo.'} Os documentos sobem trancados com a sua senha: ninguém mais consegue ler.</p>`}
      ${st.signedIn ? `<p>Conectado como <b>${esc(st.email)}</b>. Digite a senha para abrir o cofre.</p>`
        : `<input class="inp" id="syncemail" type="email" autocomplete="email" placeholder="seu@email.com" value="${esc(syncEmail)}">`}
      <input class="inp" id="syncpass" type="password" autocomplete="${up ? 'new-password' : 'current-password'}" placeholder="${up ? 'Crie uma senha (mínimo 8 caracteres)' : 'Senha'}">
      ${up ? `<input class="inp" id="syncpass2" type="password" autocomplete="new-password" placeholder="Repita a senha">
      <p class="fine-note">Esta senha também tranca seus documentos. <b>Se esquecer, os documentos da nuvem não podem ser recuperados</b> (os deste aparelho continuam aqui). Guarde no gerenciador de senhas.</p>` : ''}
      ${note}
      <div class="row-btns">
        <button class="btn primary sm" data-act="${up ? 'sync-up' : 'sync-in'}">${up ? 'Criar conta' : st.signedIn ? 'Abrir e sincronizar' : 'Entrar'}</button>
        ${st.signedIn ? '<button class="btn ghost sm" data-act="sync-out">Sair</button>'
          : `<button class="btn ghost sm" data-act="sync-mode">${up ? 'Já tenho conta' : 'Criar conta'}</button>`}
      </div>`;
    return;
  }
  const when = st.last ? st.last.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
  const label = st.status === 'syncing' ? 'Sincronizando…' : st.status === 'offline' ? 'Sem internet. Sincroniza quando a conexão voltar.' : st.status === 'error' ? '' : when ? `Sincronizado às ${when}` : 'Pronto';
  box.innerHTML = `<h3>Sincronizar entre aparelhos</h3>
    <p>Conectado como <b>${esc(st.email)}</b>. Seus documentos são trancados neste aparelho antes de subir.</p>
    <p class="sync-ok">${label}</p>${note}
    <div class="row-btns"><button class="btn primary sm" data-act="sync-now">Sincronizar agora</button><button class="btn ghost sm" data-act="sync-out">Sair deste aparelho</button></div>`;
}
// não redesenha enquanto a pessoa digita no bloco
Sync.on(() => { if (!document.activeElement?.closest('#syncbox')) renderSync() });

async function syncAction(act, btn){
  const busy = t => { if (btn) { btn.disabled = true; btn.textContent = t } };
  try {
    if (act === 'sync-mode') { syncMode = syncMode === 'up' ? 'in' : 'up'; syncSent = false; return renderSync() }
    if (act === 'sync-up' || act === 'sync-in') {
      const st = Sync.state;
      const e = st.signedIn ? st.email : $('#syncemail').value.trim();
      const p = $('#syncpass').value, p2 = $('#syncpass2')?.value;
      if (!/^\S+@\S+\.\S+$/.test(e)) return renderSync('Digite um e-mail válido.');
      if (p.length < 8) return renderSync('A senha precisa ter pelo menos 8 caracteres.');
      if (p2 !== undefined && p !== p2) return renderSync('As duas senhas não são iguais.');
      syncEmail = e; store.set('carimbo.email', e);
      if (st.signedIn) { busy('Abrindo…'); await Sync.unlock(p) }
      else if (act === 'sync-up') {
        busy('Criando…');
        if (await Sync.signUp(e, p) === 'confirm') { syncSent = true; syncMode = 'in'; return renderSync() }
      } else { busy('Entrando…'); await Sync.signIn(e, p) }
      syncSent = false; toast('Sincronização ligada'); renderSync();
    }
    if (act === 'sync-now') { busy('Sincronizando…'); await Sync.syncNow(); renderSync() }
    if (act === 'sync-out') {
      if (!confirm('Sair da sincronização neste aparelho? Os documentos continuam aqui.')) return;
      await Sync.signOut(); syncMode = 'in'; renderSync();
    }
  } catch (e) { renderSync(e.message || 'Algo deu errado. Tente de novo.') }
}

/* ---------- Backup ---------- */
function openSettings(){
  const dlg = $('#form');
  dlg.innerHTML = `<div class="sheet settings">
    <div class="sheet-h"><h2>Backup e ajustes</h2><button type="button" class="icon-btn" data-act="close" aria-label="Fechar">${ICON.close}</button></div>
    <div class="sheet-b">
      <div class="group" id="syncbox"></div>
      <div class="group"><h3>Neste aparelho</h3>
        <p class="meter" id="meter"></p></div>
      <div class="group"><h3>Fazer backup</h3>
        <p>Gera um arquivo com todos os documentos e viagens. Guarde em um lugar seguro, como seu e-mail ou nuvem pessoal.</p>
        <div class="row-btns"><button class="btn primary sm" data-act="export">Baixar backup</button></div></div>
      <div class="group"><h3>Restaurar backup</h3>
        <p>Junta os documentos do arquivo com os que já estão aqui.</p>
        <div class="row-btns"><label class="btn ghost sm" style="cursor:pointer"><input type="file" accept=".json,application/json" data-import class="sr">Escolher arquivo de backup</label></div></div>
      <div class="group"><h3>Instalar no celular</h3>
        <p>iPhone: no Safari, toque em Compartilhar e depois em “Adicionar à Tela de Início”. Android: no Chrome, toque no menu e em “Instalar app”. Depois disso abre sem internet.</p></div>
    </div></div>`;
  dlg.showModal();
  renderSync();
  if (navigator.storage?.estimate) navigator.storage.estimate().then(e => {
    const mb = n => (n / 1048576).toFixed(1).replace('.', ',') + ' MB';
    const m = $('#meter'); if (m) m.textContent = `Usando ${mb(e.usage || 0)} de ${mb(e.quota || 0)} disponíveis`;
  });
}

const toDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b) });

async function exportAll(){
  toast('Preparando backup…');
  const docs = await Promise.all(state.docs.map(async d => ({ ...d, files: await Promise.all((d.files || []).map(async f => ({ name:f.name, type:f.type, data: await toDataURL(f.blob) }))) })));
  const json = JSON.stringify({ app:'carimbo', version:1, exportedAt:new Date().toISOString(), trips:state.trips, docs });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type:'application/json' }));
  a.download = `carimbo-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Backup baixado');
}

async function importAll(file){
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'carimbo') throw 0;
    for (const t of data.trips || []) await dbPut('trips', t);
    for (const d of data.docs || []) {
      d.files = await Promise.all((d.files || []).map(async f => ({ name:f.name, type:f.type, blob: await (await fetch(f.data)).blob() })));
      await dbPut('docs', d);
    }
    await load(); $('#form').close(); Sync.changed();
    toast(`${(data.docs || []).length} documentos restaurados`);
  } catch { toast('Este arquivo não é um backup do Carimbo') }
}

/* ---------- Eventos ---------- */
let toastT, lastDeleted = null;
async function deleteDoc(id){
  const d = state.docs.find(x => x.id === id); if (!d) return;
  await dbDel('docs', id); state.docs = state.docs.filter(x => x.id !== id); lastDeleted = d; Sync.deleted('docs', id);
  if ($('#form').open) $('#form').close();
  if ($('#viewer').open) closeViewer();
  render();
  const t = $('#toast'); clearTimeout(toastT);
  t.innerHTML = 'Documento excluído <button type="button" data-act="undo-del">Desfazer</button>';
  t.classList.add('on', 'undo');
  toastT = setTimeout(() => { t.classList.remove('on', 'undo'); lastDeleted = null }, 6000);
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.remove('undo'); t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200) }
function setFilter(id){ state.filter = id; store.set('carimbo.filter', id); render(); window.scrollTo({ top:0 }) }

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const { act, id } = b.dataset;
  if (act === 'check') return; // tratado no change
  switch (act) {
    case 'filter': setFilter(id); break;
    case 'new-doc': addDoc(); break;
    case 'kind-blank': openDocForm(null); break;
    case 'skip-read': readToken++; skipExisting ? openDocForm(skipExisting) : openDocForm(null, { type: 'other', files: skipFiles, filled: [], x: {}, skipped: true }); break;
    case 'new-trip': openTripForm(); break;
    case 'edit-trip': openTripForm(state.trips.find(t => t.id === id)); break;
    case 'settings': openSettings(); break;
    case 'export': exportAll(); break;
    case 'sync-up': case 'sync-in': case 'sync-mode': case 'sync-now': case 'sync-out': syncAction(act, b); break;
    case 'close': { const d = b.closest('dialog'); if (d.id === 'viewer') closeViewer(); else { readToken++; d.close() } break }
    case 'open': {
      openViewer([id], 0, false); break;
    }
    case 'present': {
      const ids = (id === 'pinned' ? state.docs.filter(d => d.pinned) : state.docs.filter(d => d.tripId === id || (!d.tripId && d.pinned))).sort(sortDocs).map(d => d.id);
      if (!ids.length) return toast('Adicione documentos primeiro');
      openViewer(ids, 0, true); break;
    }
    case 'prev': if (pos > 0) { pos--; drawViewer() } break;
    case 'nextdoc': if (pos < seq.length - 1) { pos++; drawViewer() } break;
    case 'edit-doc': closeViewer(); openDocForm(state.docs.find(d => d.id === id)); break;
    case 'reread': {
      const doc = state.docs.find(d => d.id === id); closeViewer();
      readNewDoc(doc.files.map(f => f.blob instanceof File ? f.blob : new File([f.blob], f.name, { type: f.type })), doc);
      break;
    }
    case 'copy': try { await navigator.clipboard.writeText(b.dataset.v); toast('Número copiado') } catch { toast('Não foi possível copiar') } break;
    case 'rm-file': draftFiles.splice(+b.dataset.i, 1); drawFiles(); break;
    case 'del-doc': deleteDoc(id); break;
    case 'undo-del':
      if (!lastDeleted) return;
      await dbPut('docs', lastDeleted); state.docs.push(lastDeleted); Sync.restored('docs', lastDeleted.id); lastDeleted = null;
      render(); toast('Documento restaurado'); break;
    case 'del-trip': {
      if (!confirm('Excluir esta viagem? Os documentos dela passam para Pessoais.')) return;
      for (const d of state.docs.filter(d => d.tripId === id)) { d.tripId = ''; d.updatedAt = Date.now(); await dbPut('docs', d) }
      await dbDel('trips', id); Sync.deleted('trips', id); state.trips = state.trips.filter(t => t.id !== id);
      $('#form').close(); setFilter('all'); toast('Viagem excluída'); break;
    }
    case 'uncheck-del': {
      const t = state.trips.find(t => t.id === state.filter); if (!t) return;
      t.checklist = t.checklist.filter(c => c.id !== id); updateTrip(t); break;
    }
  }
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.matches('[data-act=check]')) {
    const t = state.trips.find(t => t.id === state.filter); if (!t) return;
    const c = t.checklist.find(c => c.id === el.dataset.id); c.done = el.checked; updateTrip(t);
  }
  if (el.matches('[data-pick]')) {
    const added = [];
    for (const f of el.files) added.push(await prepFile(f));
    el.value = ''; draftFiles.push(...added); drawFiles();
    if (added.length) readIntoForm(added);
  }
  if (el.id === 'addfile' && el.files.length) { const fl = [...el.files]; el.value = ''; readNewDoc(fl) }
  if (el.matches('[data-import]') && el.files[0]) importAll(el.files[0]);
  if (el.matches('[name=type]') && el.form?.dataset.form === 'doc') changeType(el.form, el.value);
});

document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.form === 'doc') saveDoc(f);
  if (f.dataset.form === 'trip') saveTrip(f);
  if (f.dataset.form === 'addcheck') {
    const label = f.label.value.trim(), t = state.trips.find(t => t.id === state.filter);
    if (!label || !t) return;
    t.checklist = (t.checklist || []).concat({ id:uid(), label, done:false });
    updateTrip(t).then(() => document.querySelector('[data-form=addcheck] input')?.focus());
  }
});

document.addEventListener('keydown', e => {
  if (!$('#viewer').open) return;
  if (e.key === 'ArrowRight' && pos < seq.length - 1) { pos++; drawViewer() }
  if (e.key === 'ArrowLeft' && pos > 0) { pos--; drawViewer() }
});

/* ---------- Faixa de segurança (guilhoché) ---------- */
(function(){
  const W = 600, H = 46; let p = '';
  for (let k = 0; k < 12; k++) {
    let d = '';
    for (let x = 0; x <= W; x += 4) {
      const y = H/2 + Math.sin(x/34 + k*.52) * 15 * Math.cos(x/170 + k*.18) + Math.sin(x/9 + k) * 1.6;
      d += (x ? 'L' : 'M') + x + ' ' + y.toFixed(1);
    }
    p += `<path d="${d}"/>`;
  }
  $('#guil').innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width=".8">${p}</g></svg>`;
})();

/* ---------- Início ---------- */
async function load(){
  [state.docs, state.trips] = await Promise.all([dbAll('docs'), dbAll('trips')]);
  render();
}
load().then(() => Sync.init()).catch(() => { $('#app').innerHTML = '<div class="empty"><h3>Armazenamento indisponível</h3><p>Abra o Carimbo fora da janela anônima para guardar documentos neste aparelho.</p></div>' });
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadSW && !document.querySelector('dialog[open]')) location.reload();
  });
}
async function backfillThumbs(){
  for (const d of state.docs) {
    const pdfs = (d.files || []).filter(f => f.type === 'application/pdf' && !f.thumb);
    if (!pdfs.length) continue;
    for (const f of pdfs) f.thumb = await Extract.pdfThumb(f.blob).catch(() => null);
    await dbPut('docs', d).catch(() => {});
  }
  render();
}
setTimeout(() => backfillThumbs().catch(() => {}), 1500);
</script>
